name: CI Type

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  type:
    name: CI Type
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6.6.0

      - name: Sync
        run: uv sync --group ci

      - name: Pyright
        run: uv run pyright

      - name: Basedpyright (advisory)
        continue-on-error: true
        run: uv run basedpyright
