name: CI PR Comment

permissions:
  actions: read
  contents: read
  checks: read
  pull-requests: write

on:
  workflow_run:
    workflows:
      - CI Type
      - CI Format
      - CI Lint
      - CI Tests
    types:
      - completed
  pull_request:
    types: [opened]

jobs:
  comment:
    name: PR Comment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download type-stats artifact
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI Type'
        uses: dawidd6/action-download-artifact@v6
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: type-stats
          path: /tmp/type-stats

      - name: Post CI Results
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Extract PR number and SHA based on event type
            let sha, issueNumber;
            if (context.eventName === 'pull_request') {
              sha = context.payload.pull_request.head.sha;
              issueNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'workflow_run') {
              const prs = context.payload.workflow_run.pull_requests;
              if (prs && prs.length > 0) {
                issueNumber = prs[0].number;
              }
              sha = context.payload.workflow_run.head_sha;
            }

            if (!issueNumber || !sha) {
              console.log('No PR number or SHA found, skipping comment.');
              return;
            }

            // Read type-stats artifact if available (downloaded from CI Type run)
            const fs = require('fs');
            let typeStats = null;
            try {
              const statsPath = '/tmp/type-stats/type-stats.json';
              if (fs.existsSync(statsPath)) {
                typeStats = JSON.parse(fs.readFileSync(statsPath, 'utf8'));
              }
            } catch (e) {
              console.log('Failed to read type-stats artifact:', e.message);
            }

            const { data } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              filter: 'latest'
            });

            function findCheck(pattern) {
              for (const run of data.check_runs) {
                if (run.name.includes(pattern)) return run;
              }
              return null;
            }

            function statusText(run) {
              if (!run) return 'pending';
              if (run.status !== 'completed') return 'pending';
              if (run.conclusion === 'success') return 'pass';
              if (run.conclusion === 'failure') return 'fail';
              if (run.conclusion === 'neutral') return 'skip';
              return run.conclusion || 'pending';
            }

            const typeRun = findCheck('CI Type');
            const formatRun = findCheck('CI Format');
            const lintRun = findCheck('CI Lint');
            const testsRun = findCheck('CI Tests');

            let body = '## CI Results\n\n';

            if (typeRun) {
              const ts = statusText(typeRun);

              body += '### Pyright\n';
              if (typeStats && typeStats.pyright) {
                body += '| Status | Errors | Warnings |\n';
                body += '|--------|--------|----------|\n';
                body += `| ${ts} | ${typeStats.pyright.errors ?? 'N/A'} | ${typeStats.pyright.warnings ?? 'N/A'} |\n\n`;
              } else {
                body += '| Status |\n';
                body += '|--------|\n';
                body += `| ${ts} |\n\n`;
              }

              body += '### Basedpyright (advisory)\n';
              if (typeStats && typeStats.basedpyright) {
                body += '| Status | Errors | Warnings | Diagnostics |\n';
                body += '|--------|--------|----------|-------------|\n';
                body += `| ${ts} | ${typeStats.basedpyright.errors ?? 'N/A'} | ${typeStats.basedpyright.warnings ?? 'N/A'} | ${typeStats.basedpyright.diagnostics ?? 'N/A'} |\n\n`;
              } else {
                body += '| Status |\n';
                body += '|--------|\n';
                body += `| ${ts} |\n\n`;
              }
            }

            body += '### Other Checks\n';
            body += '| Check  | Status |\n';
            body += '|--------|--------|\n';
            body += `| Format | ${statusText(formatRun)} |\n`;
            body += `| Lint   | ${statusText(lintRun)} |\n`;
            body += `| Tests  | ${statusText(testsRun)} |\n`;

            // Upsert: find existing bot comment or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const botComment = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.startsWith('## CI Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              });
            }
